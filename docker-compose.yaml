# Ambiente local completo: 3 servicos + PostgreSQL + LocalStack (SQS/DynamoDB).
#   podman compose up -d --build   (ou docker compose)
#   curl localhost:8081/health ; curl localhost:8082/health ; curl localhost:8083/health
name: solidarytech

x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solidary
      POSTGRES_PASSWORD: solidary
      POSTGRES_DB: postgres
    volumes:
      - ./scripts/local/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./src/ngo-service/db/init.sql:/sql/ngo.sql:ro
      - ./src/donation-service/db/init.sql:/sql/donation.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidary"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,dynamodb
    volumes:
      - ./scripts/local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name SolidaryTechVolunteers >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  ngo-service:
    build: ./src/ngo-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/ngo_db
      OTEL_SDK_DISABLED: "true"
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  donation-service:
    build: ./src/donation-service
    environment:
      <<: *aws-local
      PORT: "8082"
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/donation_db
      AWS_SQS_URL: http://localstack:4566/000000000000/solidary-donations
      CHAOS_TOKEN: local-chaos
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  volunteer-service:
    build: ./src/volunteer-service
    environment:
      <<: *aws-local
      PORT: "8083"
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
      AWS_DYNAMODB_NGO_INDEX: ngo_id-index
      OTEL_SDK_DISABLED: "true"
    ports: ["8083:8083"]
    depends_on:
      localstack: { condition: service_healthy }
