name: ngo-service

on:
  pull_request:
    paths: ["src/ngo-service/**", ".github/workflows/ngo-service.yml", ".github/workflows/reusable-python.yml", ".github/workflows/reusable-docker.yml"]
  push:
    branches: [main]
    paths: ["src/ngo-service/**", ".github/workflows/ngo-service.yml", ".github/workflows/reusable-python.yml", ".github/workflows/reusable-docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ngo-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-python.yml
    with:
      service-path: src/ngo-service

  # Em PR: build + Trivy sem push. Em main: push no ECR + GitOps.
  docker:
    needs: ci
    uses: ./.github/workflows/reusable-docker.yml
    with:
      service-path: src/ngo-service
      image-name: ngo-service
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
