name: Terraform CI (fmt, validate, tflint, checkov)

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-ci.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform-ci.yml"]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: fmt + validate + tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [networking, security, data, platform, compute, finops]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate
        working-directory: terraform/environments/prod/${{ matrix.layer }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint (inclui politica de tags FinOps)
        working-directory: terraform/environments/prod/${{ matrix.layer }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl"
          # Notice (tags via modulo) nao falha; Warning+ falha (ex: required_version ausente).
          tflint --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl" \
                 --call-module-type=all \
                 --minimum-failure-severity=warning

  checkov:
    name: Checkov (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          config_file: terraform/.checkov.yaml
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true
