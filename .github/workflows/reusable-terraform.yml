name: Reusable Terraform Layer

on:
  workflow_call:
    inputs:
      layer:
        required: true
        type: string
      action:
        description: "plan | apply | destroy"
        required: true
        type: string
      continue-on-error:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.layer }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue-on-error }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_budget_emails: ${{ secrets.BUDGET_EMAILS }}
      WORKDIR: terraform/environments/prod/${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1"

      # Reconcilia o state com a AWS (sessoes do Academy expiram no meio de
      # applies/destroys e deixam "fantasmas" no state).
      - name: Refresh-only (drift)
        if: inputs.action != 'destroy'
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -refresh-only -auto-approve -input=false

      - name: Plan
        if: inputs.action != 'destroy'
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.WORKDIR }}
        run: terraform destroy -input=false -auto-approve

      - name: Outputs no resumo do job
        if: inputs.action == 'apply'
        working-directory: ${{ env.WORKDIR }}
        run: |
          {
            echo "### Terraform ${{ inputs.layer }}"
            echo '```'
            terraform output -no-color || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
